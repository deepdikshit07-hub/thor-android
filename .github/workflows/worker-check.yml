name: THOR Worker checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/**'
      - 'feature/**'
    paths:
      - 'cloudflare/master-mode/**'
      - '.github/workflows/worker-check.yml'
  pull_request:
    paths:
      - 'cloudflare/master-mode/**'
      - '.github/workflows/worker-check.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        working-directory: cloudflare/master-mode
        run: node --check src/index.js
      - name: Run Worker route tests
        working-directory: cloudflare/master-mode
        run: npm test

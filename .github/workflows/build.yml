name: Build THOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The 586 MB LiteRT model is intentionally NOT bundled into the APK.
      # ThorOfflineAi already downloads it on demand into private app storage.
      - name: Build lightweight debug APK
        run: |
          VERSION_CODE="$GITHUB_RUN_ID"
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          gradle --no-daemon :app:assembleDebug \
            -PthorVersionCode="$VERSION_CODE" \
            -PthorVersionName="$VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THOR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build THOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fetch lightweight Sherpa ONNX Android runtime
        run: |
          mkdir -p app/libs /tmp/sherpa-aar
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          unzip -q /tmp/sherpa-onnx-2.0.1.aar -d /tmp/sherpa-aar
          test -f /tmp/sherpa-aar/jni/arm64-v8a/libsherpa-onnx-jni.so
          rm -rf /tmp/sherpa-aar/jni/armeabi-v7a /tmp/sherpa-aar/jni/x86 /tmp/sherpa-aar/jni/x86_64
          (cd /tmp/sherpa-aar && zip -qr "$GITHUB_WORKSPACE/app/libs/sherpa-onnx-2.0.1-arm64.aar" .)

      # The 586 MB LiteRT model is intentionally NOT bundled into the APK.
      # ThorOfflineAi already downloads it on demand into private app storage.
      - name: Build lightweight debug APK
        run: |
          VERSION_CODE="$GITHUB_RUN_ID"
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          gradle --no-daemon :app:assembleDebug \
            -PthorVersionCode="$VERSION_CODE" \
            -PthorVersionName="$VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THOR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build THOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - thor-2.0-upgrade
  pull_request:
    branches:
      - main
      - feature/thor-ota-updates

permissions:
  contents: read

# PR and push events for the same branch share one build slot. This avoids
# duplicate Gradle downloads and reduces transient Maven Central rate limits.
concurrency:
  group: thor-android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Android lint and unit tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:lintDebug :app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt $attempt failed; retrying after backoff."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      # The 586 MB LiteRT model is intentionally NOT bundled into the APK.
      # ThorOfflineAi already downloads it on demand into private app storage.
      - name: Build lightweight debug APK
        run: |
          VERSION_CODE="$((GITHUB_RUN_ID % 2000000000))"
          if [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:assembleDebug \
              -PthorVersionCode="$VERSION_CODE" \
              -PthorVersionName="$VERSION_NAME"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle APK build attempt $attempt failed; retrying after backoff."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THOR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
